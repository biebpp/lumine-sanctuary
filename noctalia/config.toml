[accessibility]
ui_scale = 1.20

[bar.default]
center = [ "group:g2" ]
concave_edge_corners = true
end = [ "media", "group:g3" ]
margin_edge = 0
margin_ends = 0
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 0
radius_top_right = 0
scale = 0.90
start = [ "clock", "ram_2" ]
thickness = 30

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
border = "on_secondary"
border_width = 0.0
enabled = true
fill = "tertiary"
foreground = "on_surface"
id = "g2"
members = [ "active_window", "workspaces" ]
opacity = 0.5
padding = 8.0
radius = 8.0

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
border = "on_secondary"
border_width = 0.0
enabled = true
fill = "tertiary"
foreground = "on_surface"
id = "g3"
members = [ "network", "volume", "battery" ]
opacity = 0.5
padding = 8.0
radius = 8.0

[shell]
clipboard_image_action_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

[shell.greeter_sync]
auto_sync = false

[shell.panel]
open_near_click_control_center = true
session_placement = "floating"
session_position = "center"

[shell.screenshot]
copy_to_clipboard = false
pipe_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
pipe_to_command = true
save_to_file = false

[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = true
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 0.0
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 3.0
enabled = true
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 3.0
enabled = true
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 3.0
enabled = true
shortcut = "5"
variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

[theme.templates]
builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "alacritty" ]

[widget.clock]
color = "on_surface"
format = "{:%H:%M %A %m/%d/%y}"

[widget.launcher]
color = "on_surface"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
color = "on_surface"

[widget.notifications]
color = "on_surface"

[widget.session]
color = "on_surface"

[widget.spacer_1]
type = "spacer"

[widget.temp]
show_value = false

[widget.sysmon_2]
glyph = "gpu-usage"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.tray]
capsule = true
capsule_fill = "on_secondary"

[widget.volume]
color = "on_surface"

[widget.workspaces]
active_pill_size = 2.5
capsule = true
capsule_fill = "on_primary"
inactive_pill_size = 1.0
pill_scale = 0.80
show_labels = false

[notification]
position = "bottom_right"
layer = "top"
scale = 0.75
width = 350

[osd]
scale = 0.70

[widget.ram_2]
amount_first = false
type = "pulser/hover-widgets:ram"

[plugins]
enabled = [ "noctalia/mpvpaper", "pulser/hover-widgets" ]
